<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<title>Glass Terrarium</title>
<style>
  :root{--ink:#ece6da;--accent:#a6e08a;--glass:rgba(16,20,16,.72);--line:rgba(255,255,255,.12)}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0a09;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%)}
  #title{position:fixed;left:calc(18px + env(safe-area-inset-left));top:calc(16px + env(safe-area-inset-top));pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  #title h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.04em}
  #title p{margin:4px 0 0;font-size:12px;opacity:.75}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0a09;font-size:14px;letter-spacing:.06em;transition:opacity .6s;z-index:10}
  #loading.hide{opacity:0;pointer-events:none}
  button{font:inherit;color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none}
  #bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;padding:6px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.35);transition:opacity .25s,transform .25s}
  #bar.hidden{opacity:0;pointer-events:none;transform:translate(-50%,12px)}
  #bar button{display:flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid transparent;background:transparent;font-size:14px;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
  #bar button:hover{background:rgba(255,255,255,.06)}
  #bar button svg{width:18px;height:18px;flex:none}
  #bar button[aria-pressed="true"]{background:rgba(166,224,138,.14);border-color:rgba(166,224,138,.35);color:#d8f5c8}
  #bar button.primary{background:#3c5a32;border-color:rgba(166,224,138,.35)}
  #bar button.primary:hover{background:#476a3b}
  #tour{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 24px));box-sizing:border-box;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:none;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  #tour.on{display:block}
  #tour .kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;font-variant-numeric:tabular-nums}
  #tour h2{margin:0 0 6px;font-size:17px;font-weight:600}
  #tour p{margin:0;font-size:14px;line-height:1.55;opacity:.88;max-height:30vh;overflow:auto}
  #tour .row{display:flex;gap:8px;margin-top:12px}
  #tour button{flex:1;min-height:44px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:14px}
  #tour button:hover{background:rgba(255,255,255,.1)}
  #tour button.primary{background:#3c5a32;border-color:rgba(166,224,138,.35)}
  #tour button:disabled{opacity:.35;cursor:default}
  #hint{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);font-size:12px;opacity:.6;pointer-events:none;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.7);transition:opacity 1s}
  #hint.gone{opacity:0}
  @media (max-width:600px){
    #title h1{font-size:16px}
    #hint{top:auto;bottom:calc(84px + env(safe-area-inset-bottom))}
    #bar{width:calc(100% - 24px);box-sizing:border-box;justify-content:space-between}
    #bar button{flex:1;justify-content:center;padding:0 8px}
    #tour h2{font-size:16px}#tour p{font-size:13.5px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">Growing terrarium…</div>
<div id="vignette"></div>
<div id="title"><h1>Glass Terrarium</h1><p id="status">—</p></div>
<div id="hint">Drag to rotate · Pinch or scroll to zoom</div>
<div id="bar">
  <button id="dayBtn" aria-pressed="false" aria-label="Switch to night"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Night</span></button>
  <button id="lampBtn" aria-pressed="false" aria-label="Desk lamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg><span>Lamp</span></button>
  <button id="tourBtn" class="primary" aria-label="Start the tour"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span>Tour</span></button>
</div>
<div id="tour">
  <div class="kicker" id="tourStep"></div>
  <h2 id="tourTitle"></h2>
  <p id="tourText"></p>
  <div class="row"><button id="tourPrev">‹ Prev</button><button id="tourNext" class="primary">Next ›</button><button id="tourExit">Exit</button></div>
</div>

<script>
'use strict';
(() => {
const cv = document.getElementById('c');
const loadingEl = document.getElementById('loading');
const gl = cv.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
if (!gl) { loadingEl.textContent = 'Sorry — this needs a browser with WebGL2.'; return; }
const aniso = gl.getExtension('EXT_texture_filter_anisotropic');
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

/* =========================================================
   Utilities: random, noise, colour
   ========================================================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(20261016);
const rr = (a,b) => a+(b-a)*rand();
const smooth = (a,b,x) => { const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const lerp = (a,b,t) => a+(b-a)*t;
const clamp = (x,a,b) => Math.min(b,Math.max(a,x));
function hash3(i,j,k){let h=Math.imul(i,374761393)^Math.imul(j,668265263)^Math.imul(k,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function noise3(x,y,z){
  const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);const fx=x-X,fy=y-Y,fz=z-Z;
  const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),w=fz*fz*(3-2*fz);
  const a=hash3(X,Y,Z),b=hash3(X+1,Y,Z),c=hash3(X,Y+1,Z),d=hash3(X+1,Y+1,Z),e=hash3(X,Y,Z+1),f=hash3(X+1,Y,Z+1),g=hash3(X,Y+1,Z+1),h=hash3(X+1,Y+1,Z+1);
  const x1=a+(b-a)*u,x2=c+(d-c)*u,x3=e+(f-e)*u,x4=g+(h-g)*u;const y1=x1+(x2-x1)*v,y2=x3+(x4-x3)*v;return y1+(y2-y1)*w;
}
function fbm3(x,y,z,oct=4){let s=0,a=0.5,f=1,n=0;for(let i=0;i<oct;i++){s+=a*noise3(x*f,y*f,z*f);n+=a;f*=2.03;a*=0.5;}return s/n;}
const s2l = v => v<=0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);
const srgb = h => [s2l((h>>16&255)/255), s2l((h>>8&255)/255), s2l((h&255)/255)];
const mix3 = (a,b,t) => [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];

/* =========================================================
   Vector + matrix maths (column-major, like WebGL)
   ========================================================= */
class V {
  constructor(x=0,y=0,z=0){this.x=x;this.y=y;this.z=z;}
  set(x,y,z){this.x=x;this.y=y;this.z=z;return this;}
  copy(v){this.x=v.x;this.y=v.y;this.z=v.z;return this;}
  clone(){return new V(this.x,this.y,this.z);}
  add(v){this.x+=v.x;this.y+=v.y;this.z+=v.z;return this;}
  sub(v){this.x-=v.x;this.y-=v.y;this.z-=v.z;return this;}
  as(v,s){this.x+=v.x*s;this.y+=v.y*s;this.z+=v.z*s;return this;}
  ms(s){this.x*=s;this.y*=s;this.z*=s;return this;}
  dot(v){return this.x*v.x+this.y*v.y+this.z*v.z;}
  len(){return Math.hypot(this.x,this.y,this.z);}
  norm(){const l=this.len()||1;return this.ms(1/l);}
  dist(v){return Math.hypot(this.x-v.x,this.y-v.y,this.z-v.z);}
  lerp(v,t){this.x+=(v.x-this.x)*t;this.y+=(v.y-this.y)*t;this.z+=(v.z-this.z)*t;return this;}
  lerpV(a,b,t){return this.set(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));}
  cross(a,b){return this.set(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);}
  arr(){return [this.x,this.y,this.z];}
}
const V3 = (x,y,z) => new V(x,y,z);
const M = {
  I(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;},
  mul(a,b){const o=new Float32Array(16);
    for(let c=0;c<4;c++){const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
      o[c*4]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;o[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
      o[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;o[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;}
    return o;},
  chain(...ms){let r=ms[0];for(let i=1;i<ms.length;i++)r=M.mul(r,ms[i]);return r;},
  T(x,y,z){const m=M.I();m[12]=x;m[13]=y;m[14]=z;return m;},
  S(x,y=x,z=x){const m=M.I();m[0]=x;m[5]=y;m[10]=z;return m;},
  RX(a){const c=Math.cos(a),s=Math.sin(a),m=M.I();m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m;},
  RY(a){const c=Math.cos(a),s=Math.sin(a),m=M.I();m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m;},
  RZ(a){const c=Math.cos(a),s=Math.sin(a),m=M.I();m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m;},
  basis(x,y,z,p){const m=M.I();m[0]=x.x;m[1]=x.y;m[2]=x.z;m[4]=y.x;m[5]=y.y;m[6]=y.z;m[8]=z.x;m[9]=z.y;m[10]=z.z;if(p){m[12]=p.x;m[13]=p.y;m[14]=p.z;}return m;},
  persp(fovy,asp,n,f){const t=1/Math.tan(fovy/2),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m;},
  ortho(l,r,b,t,n,f){const m=M.I();m[0]=2/(r-l);m[5]=2/(t-b);m[10]=-2/(f-n);m[12]=-(r+l)/(r-l);m[13]=-(t+b)/(t-b);m[14]=-(f+n)/(f-n);return m;},
  lookAt(e,t,u){const z=e.clone().sub(t).norm(),x=new V().cross(u,z).norm(),y=new V().cross(z,x),m=M.I();
    m[0]=x.x;m[4]=x.y;m[8]=x.z;m[1]=y.x;m[5]=y.y;m[9]=y.z;m[2]=z.x;m[6]=z.y;m[10]=z.z;m[12]=-x.dot(e);m[13]=-y.dot(e);m[14]=-z.dot(e);return m;},
  pt(m,x,y,z){return[m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14]];},
  nrm(m){const a=m[0],b=m[4],c=m[8],d=m[1],e=m[5],f=m[9],g=m[2],h=m[6],i=m[10];
    const A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g,D=-(b*i-c*h),E=a*i-c*g,F=-(a*h-b*g),G=b*f-c*e,H=-(a*f-c*d),II=a*e-b*d;
    return(x,y,z)=>{const nx=A*x+B*y+C*z,ny=D*x+E*y+F*z,nz=G*x+H*y+II*z,l=Math.hypot(nx,ny,nz)||1;return[nx/l,ny/l,nz/l];};}
};
const IDM = M.I();

/* =========================================================
   Geometry builders
   ========================================================= */
const G = () => ({p:[],n:[],uv:[],c:[],idx:[]});
function computeNormals(g){
  const n=new Float32Array(g.p.length),p=g.p,ix=g.idx;
  for(let k=0;k<ix.length;k+=3){const a=ix[k]*3,b=ix[k+1]*3,c=ix[k+2]*3;
    const ux=p[b]-p[a],uy=p[b+1]-p[a+1],uz=p[b+2]-p[a+2],vx=p[c]-p[a],vy=p[c+1]-p[a+1],vz=p[c+2]-p[a+2];
    const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
    n[a]+=nx;n[a+1]+=ny;n[a+2]+=nz;n[b]+=nx;n[b+1]+=ny;n[b+2]+=nz;n[c]+=nx;n[c+1]+=ny;n[c+2]+=nz;}
  for(let q=0;q<n.length;q+=3){const l=Math.hypot(n[q],n[q+1],n[q+2])||1;n[q]/=l;n[q+1]/=l;n[q+2]/=l;}
  g.n=Array.from(n);return g;
}
function xform(g,m){const nf=M.nrm(m);
  for(let i=0;i<g.p.length;i+=3){const q=M.pt(m,g.p[i],g.p[i+1],g.p[i+2]);g.p[i]=q[0];g.p[i+1]=q[1];g.p[i+2]=q[2];
    const r=nf(g.n[i],g.n[i+1],g.n[i+2]);g.n[i]=r[0];g.n[i+1]=r[1];g.n[i+2]=r[2];}
  return g;}
function cloneG(g){const o={};for(const k in g)o[k]=Array.isArray(g[k])?g[k].slice():g[k];return o;}
function paint(g,col){const nv=g.p.length/3;g.c=[];for(let i=0;i<nv;i++)g.c.push(col[0],col[1],col[2]);return g;}
function merge(list){
  const o={p:[],n:[],uv:[],c:[],pv:[],ex:[],idx:[]};
  const has=k=>list.some(g=>g[k]&&g[k].length);
  const hUv=has('uv'),hC=has('c'),hPv=has('pv'),hEx=has('ex');let base=0;
  for(const g of list){const nv=g.p.length/3;
    for(const v of g.p)o.p.push(v);for(const v of g.n)o.n.push(v);
    if(hUv){if(g.uv&&g.uv.length)for(const v of g.uv)o.uv.push(v);else for(let i=0;i<nv;i++)o.uv.push(0,0);}
    if(hC){if(g.c&&g.c.length)for(const v of g.c)o.c.push(v);else for(let i=0;i<nv;i++)o.c.push(1,1,1);}
    if(hPv){if(g.pv&&g.pv.length)for(const v of g.pv)o.pv.push(v);else for(let i=0;i<nv;i++)o.pv.push(0,0,0,0);}
    if(hEx){if(g.ex&&g.ex.length)for(const v of g.ex)o.ex.push(v);else for(let i=0;i<nv;i++)o.ex.push(0,0);}
    for(const i of g.idx)o.idx.push(i+base);base+=nv;}
  return o;
}
function icosphere(detail){
  const t=(1+Math.sqrt(5))/2;
  const v=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(a=>{const l=Math.hypot(...a);return a.map(x=>x/l);});
  let f=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  for(let d=0;d<detail;d++){const cache={},nf=[];
    const mid=(a,b)=>{const k=a<b?a+'_'+b:b+'_'+a;if(cache[k]!==undefined)return cache[k];const p=v[a].map((x,i)=>(x+v[b][i])/2),l=Math.hypot(...p);v.push(p.map(x=>x/l));return cache[k]=v.length-1;};
    for(const[a,b,c]of f){const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);nf.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]);}f=nf;}
  const g=G();for(const p of v){g.p.push(p[0],p[1],p[2]);g.n.push(p[0],p[1],p[2]);}for(const tr of f)g.idx.push(tr[0],tr[1],tr[2]);
  return g;
}
function sphere(ws,hs,ps=0,pl=Math.PI*2,ts=0,tl=Math.PI){
  const g=G(),grid=[];
  for(let iy=0;iy<=hs;iy++){const row=[],v=iy/hs;
    for(let ix=0;ix<=ws;ix++){const u=ix/ws;const x=-Math.cos(ps+u*pl)*Math.sin(ts+v*tl),y=Math.cos(ts+v*tl),z=Math.sin(ps+u*pl)*Math.sin(ts+v*tl);
      g.p.push(x,y,z);g.n.push(x,y,z);g.uv.push(u,1-v);row.push(g.p.length/3-1);}grid.push(row);}
  for(let iy=0;iy<hs;iy++)for(let ix=0;ix<ws;ix++){const a=grid[iy][ix+1],b=grid[iy][ix],c=grid[iy+1][ix],d=grid[iy+1][ix+1];
    if(iy!==0||ts>0)g.idx.push(a,b,d);if(iy!==hs-1||ts+tl<Math.PI)g.idx.push(b,c,d);}
  return g;
}
function lathe(pts,segs){
  const g=G(),n=pts.length;
  const n2=pts.map((p,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];const tx=b[0]-a[0],ty=b[1]-a[1],l=Math.hypot(tx,ty)||1;return[ty/l,-tx/l];});
  for(let j=0;j<=segs;j++){const ph=j/segs*Math.PI*2,s=Math.sin(ph),c=Math.cos(ph);
    for(let i=0;i<n;i++){const r=pts[i][0],y=pts[i][1];g.p.push(r*s,y,r*c);g.n.push(n2[i][0]*s,n2[i][1],n2[i][0]*c);g.uv.push(j/segs,i/(n-1));}}
  for(let j=0;j<segs;j++)for(let i=0;i<n-1;i++){const a=j*n+i,b=(j+1)*n+i;g.idx.push(a,b,a+1,b,b+1,a+1);}
  return g;
}
const cylinder=(rt,rb,h,seg)=>lathe([[rb,-h/2],[rt,h/2]],seg);
function makePath(fn){
  const lut=[0],N=240;let L=0,prev=fn(0);
  for(let i=1;i<=N;i++){const p=fn(i/N);L+=p.dist(prev);lut.push(L);prev=p;}
  return{raw:fn,L,at(u){const tg=clamp(u,0,1)*L;let lo=0,hi=N;while(lo<hi){const m=(lo+hi)>>1;if(lut[m]<tg)lo=m+1;else hi=m;}
    const i=Math.max(1,lo),seg=(lut[i]-lut[i-1])||1;return fn((i-1+(tg-lut[i-1])/seg)/N);}};
}
function crPath(pts){
  return makePath(t=>{const l=pts.length,P=(l-1)*t;let i=Math.floor(P),w=P-i;if(i>=l-1){i=l-2;w=1;}
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(l-1,i+2)];
    const f=(a,b,c,d)=>{const v0=(c-a)*0.5,v1=(d-b)*0.5,t2=w*w,t3=w*t2;return(2*b-2*c+v0+v1)*t3+(-3*b+3*c-2*v0-v1)*t2+v0*w+b;};
    return new V(f(p0.x,p1.x,p2.x,p3.x),f(p0.y,p1.y,p2.y,p3.y),f(p0.z,p1.z,p2.z,p3.z));});

function tube(path,tub,rad,rfn,disp){

    const b=L[3]+sw,hx=s*Math.cos(b),hz=Math.sin(b),e=0.8,d=1.1;
    const A=[s*L[0],L[1],L[2]],K=add(A,hx*Math.cos(e)*L[4],Math.sin(e)*L[4]+lift,hz*Math.cos(e)*L[4]),Fo=add(K,hx*Math.cos(d)*L[5],-Math.sin(d)*L[5],hz*Math.cos(d)*L[5]),Ta=add(Fo,hx*0.007,-0.0015,hz*0.007);
    seg(A,K,0.0012,ANT_LEG);seg(K,Fo,0.0009,ANT_LEG);seg(Fo,Ta,0.0006,ANT_LEG);}});
  if(a.carry)instPush(pools.sph,M.chain(R,M.T(0,0.026,0.036),M.RX(0.4),M.RZ(Math.sin(t*3+a.seed)*0.15),M.S(0.011,0.0012,0.008)),LEAFC,0.3);

// butterfly
const tmpV=new V();
bf={pos:V3(0.2,2.5,0.2),vel:V3(0.2,0,0),target:V3(-0.4,2.3,0.4),landing:false,mode:'fly',timer:0,yaw:0,flap:0,root:M.I()};
const wp=woodPath.at(0.82);
landSpots=[V3(0.35,rockTop(0.35,-0.12)+0.004,-0.12),V3(1.2,rockTop(1.2,-0.4)+0.004,-0.4),V3(1.45,terrainH(1.45,0.05)+0.14,0.05),V3(wp.x,wp.y+0.045,wp.z),V3(0.2,rockTop(0.2,1.25)+0.004,1.25)];
const airTarget=()=>{const y=rr(1.9,3.2),th=rr(0,Math.PI*2),r=Math.sqrt(rand())*(innerR(y)-0.45);return V3(Math.cos(th)*r,y,Math.sin(th)*r);};
function stepButterfly(dt,t,act){
  if(bf.mode==='land'){
    bf.timer-=dt*act;bf.flap=1.2+Math.sin(t*1.6)*0.28;bf.root=M.chain(M.T(bf.pos.x,bf.pos.y,bf.pos.z),M.RY(bf.yaw));
    if(bf.timer<=0&&night<0.6){bf.mode='fly';bf.landing=false;bf.target=airTarget();bf.vel.set(0,0.35,0);}
    return;
  }
  const to=tmpV.copy(bf.target).sub(bf.pos),d=to.len(),wob=bf.landing?0.25:1;
  to.norm().ms((bf.landing?Math.min(0.5,d*1.6+0.05):0.5)*act);
  to.x+=(noise3(t*0.8,1,0)-0.5)*0.7*act*wob;to.y+=(noise3(t*0.8,2,0)-0.5)*0.6*act*wob;to.z+=(noise3(t*0.8,3,0)-0.5)*0.7*act*wob;
  bf.vel.lerp(to,Math.min(1,dt*2));bf.pos.as(bf.vel,dt);
  if(!bf.landing){const gy=terrainH(bf.pos.x,bf.pos.z)+0.25;if(bf.pos.y<gy)bf.pos.y=gy;}
  bf.pos.y=Math.min(bf.pos.y,3.35);
  const mr=innerR(bf.pos.y)-0.18,r=Math.hypot(bf.pos.x,bf.pos.z);if(r>mr){bf.pos.x*=mr/r;bf.pos.z*=mr/r;}
  if(bf.landing&&d<0.025){bf.mode='land';bf.timer=rr(4,10);bf.pos.copy(bf.target);}
  else if(!bf.landing&&(d<0.3||night>0.6)){if(rand()<0.4||night>0.6){bf.landing=true;bf.target=landSpots[Math.floor(rand()*landSpots.length)].clone();}else bf.target=airTarget();}
  bf.flap=Math.sin(t*26)*0.85+0.25;
  const hv=Math.hypot(bf.vel.x,bf.vel.z);if(hv>0.02)bf.yaw=Math.atan2(bf.vel.x,bf.vel.z);
  bf.root=M.chain(M.T(bf.pos.x,bf.pos.y+Math.sin(t*26)*0.006,bf.pos.z),M.RY(bf.yaw),M.RX(-Math.atan2(bf.vel.y,hv+0.001)*0.5));
}

// snails: three gliding on the glass, two on the soil, each with its own shell colour and size
const SNAIL_VARS=[{shell:[1,1,1],body:[1,1,1],sc:1},{shell:[1.2,0.82,0.6],body:[1.05,0.95,0.85],sc:0.8},{shell:[0.75,0.85,0.95],body:[0.8,0.8,0.8],sc:1.15},{shell:[1.2,1.05,0.7],body:[1.1,1,0.88],sc:0.7},{shell:[0.85,0.68,0.58],body:[0.9,0.84,0.78],sc:0.9}];
const glassSnail=(th,y,a,vi)=>Object.assign({kind:'glass',th,y,a,n:V3(),f:V3(),pos:V3(),root:M.I(),seed:rr(0,100),speed:rr(0.012,0.02)},SNAIL_VARS[vi]);
const groundSnail=vi=>{const[x,z]=freeSpot();return Object.assign({kind:'ground',x,z,h:rr(0,Math.PI*2),speed:0.012,turn:0.8,lift:0.032,gait:0,pauseRate:0.04,pause:0,phase:0,v:0,seed:rr(0,100),root:M.I(),pos:V3(x,0,z)},SNAIL_VARS[vi]);};
snails=[glassSnail(0.62,2.15,1.3,0),glassSnail(2.3,1.7,0.2,1),glassSnail(4.1,2.6,-1.2,2),groundSnail(3),groundSnail(4)];
function poseSnail(sn){
  if(sn.kind==='ground'){const ro=rootOn(sn.x,sn.z,sn.h,sn.lift*sn.sc);sn.root=ro.m;sn.pos.set(sn.x,ro.y,sn.z);sn.n=V3(0,1,0);sn.f=V3(Math.sin(sn.h),0,Math.cos(sn.h));return;}
  const r=innerR(sn.y)+0.05-0.0105*sn.sc,c=Math.cos(sn.th),s=Math.sin(sn.th);
  sn.n.set(-c,0,-s);sn.f.set(-s*Math.cos(sn.a),Math.sin(sn.a),c*Math.cos(sn.a)).norm();
  const right=new V().cross(sn.n,sn.f);sn.pos.set(c*r,sn.y,s*r);sn.root=M.basis(right,sn.n,sn.f,sn.pos);
}
function stepSnail(sn,dt,t,act){
  if(sn.kind==='ground'){stepCrawler(sn,dt,t,act);poseSnail(sn);return;}
  const v=sn.speed*act;sn.a+=(noise3(t*0.15,sn.seed,3)-0.5)*dt*1.2;
  if(sn.y>3.0)sn.a+=angDiff(sn.a,-Math.PI/2)*dt*0.6;
  if(sn.y<SOIL_Y+0.45)sn.a+=angDiff(sn.a,Math.PI/2)*dt*0.6;
  sn.th+=Math.cos(sn.a)*v*dt/(innerR(sn.y)+0.05);sn.y+=Math.sin(sn.a)*v*dt;poseSnail(sn);
}
snails.forEach(poseSnail);
const snail=snails[0];
for(const c of crawlers){const ro=rootOn(c.x,c.z,c.h,c.lift);c.root=ro.m;c.pos.set(c.x,ro.y,c.z);}

const crawlView=(c,back,up,ahead)=>{const f=V3(Math.sin(c.h),0,Math.cos(c.h));return[c.pos.clone().as(f,-back).add(V3(0,up,0)),c.pos.clone().as(f,ahead)];};
creatureViews={
  'Ladybug':()=>crawlView(ladybugs[0],0.3,0.13,0.1),
  'Ant trail':()=>{const a=ants[3],f=V3(Math.sin(a.h),0,Math.cos(a.h)),side=V3(Math.cos(a.h),0,-Math.sin(a.h));return[a.pos.clone().as(f,-0.3).as(side,0.12).add(V3(0,0.16,0)),a.pos.clone().as(f,0.05)];},
  'Pill bug':()=>crawlView(isopods[0],0.32,0.14,0.08),
  'Butterfly':()=>{const d=V3(Math.sin(bf.yaw),0,Math.cos(bf.yaw)),side=V3(Math.cos(bf.yaw),0,-Math.sin(bf.yaw)),p=bf.pos;
    return bf.mode==='land'?[p.clone().as(side,0.32).as(d,0.12).add(V3(0,0.12,0)),p.clone().add(V3(0,0.05,0))]:[p.clone().as(d,-0.38).as(side,0.18).add(V3(0,0.3,0)),p.clone()];},
  'Snail':()=>{const right=new V().cross(snail.n,snail.f),p=snail.pos;return[p.clone().as(snail.n,0.2).as(right,0.24).as(snail.f,0.04),p.clone().as(snail.n,0.03)];}
};
stepCreatures=(dt,t,act)=>{
  for(const c of crawlers){stepCrawler(c,dt,t,act);c.phase+=c.v*dt*c.gait;const ro=rootOn(c.x,c.z,c.h,c.lift);c.root=ro.m;c.pos.set(c.x,ro.y,c.z);}
  stepAnts(dt,t,act);for(const a of ants)poseAnt(a,t);

  instPush(pools.wing,M.chain(bf.root,M.T(-0.005,0,0),M.RZ(-bf.flap),M.S(-1,1,1)),[1,1,1],0.1);
  for(const sn of snails){const base=M.mul(sn.root,M.S(sn.sc)),pulse=1+0.035*Math.sin(t*2.2+sn.seed);

  const isSun=el>0,az=ang+0.6+(isSun?0:Math.PI),e=Math.min(1,Math.max(0.18,Math.abs(el)*1.05));
  sunDir=V3(Math.cos(az)*Math.cos(e),Math.sin(e),Math.sin(az)*Math.cos(e)*0.8+0.45).norm();
  let col,I;if(isSun){col=mix3(sunWarm,sunWhite,smooth(0,0.45,el));I=3.0*smooth(0,0.2,el);}else{col=moonC;I=0.45*smooth(0,0.3,-el);}
  F.uSunDir=sunDir.arr();F.uSunCol=col.map(c=>c*I);
  const bg=mix3(mix3(cNight,cDusk,smooth(-0.25,0.05,el)),cDay,smooth(0.05,0.5,el));F.uFogCol=bg.map(c=>c*1.25);
  const amb=0.1+0.75*day;F.uSkyCol=mix3(skyNight,skyDay,day).map(c=>c*amb);F.uGndCol=[0.3*amb,0.23*amb,0.17*amb];F.uDay=day;
}

/* =========================================================
   Frame loop
   ========================================================= */
let dpr=1,shadowsOn=true;
function applyQuality(q){params.quality=q;dpr=q==='High'?Math.min(devicePixelRatio,2):q==='Balanced'?Math.min(devicePixelRatio,1.5):1;
  shadowsOn=q!=='Fast';if(shadow)makeShadow(q==='High'?2048:1536);F.uShadowTexel=1/(shadow?shadow.size:2048);
  if(mossItem)mossItem.mesh.instN=q==='Fast'?Math.floor(mossItem.full*0.5):mossItem.full;resize();}
function resize(){cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);const k=homeScale();F.uFog=[14*k,34*k];
  if(camMode==='orbit')orbit.r=clamp(orbit.r,3.2,maxR());}
addEventListener('resize',resize);
const statusEl=$('status');let fpsS=60,frameN=0;
const mist=[];for(let i=0;i<MIST;i++)mist.push({p:V3(),v:0});
const seedMist=m=>{const y=rr(SOIL_Y+0.2,3.7),th=rr(0,Math.PI*2),r=Math.sqrt(rand())*(innerR(Math.min(y,3.5))-0.25);m.p.set(Math.cos(th)*r,y,Math.sin(th)*r);m.v=rr(0.02,0.07);};
mist.forEach(seedMist);
const flies=[];for(let i=0;i<FLIES;i++)flies.push({a:rr(0,6),b:rr(0,6),r:rr(0.5,1.3),h:rr(1.7,3.2),s:rr(0.15,0.4),blink:rr(0,6),p:V3(),bl:0});
let curProg=null;
const useP=p=>{if(curProg!==p){gl.useProgram(p.p);curProg=p;for(const k in F)U(p,k,F[k]);}};
function drawItem(it,depth){
  const m=it.mesh;if(m.inst&&!m.instN)return;
  const defs=it.defs.slice();if(m.inst)defs.push('INST');if(depth)defs.push('DEPTH');
  const p=prog(depth?'depth':'lit',defs);useP(p);
  U(p,'uModel',it.model||IDM);U(p,'uUvScale',it.uvScale);U(p,'uGloss',it.gloss);U(p,'uTransl',it.transl);U(p,'uEmI',it.emI?it.emI():0);
  if(it.tex){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,it.tex);}
  if(it.double||depth)gl.disable(gl.CULL_FACE);else gl.enable(gl.CULL_FACE);
  gl.bindVertexArray(m.vao);if(!m.hasCol)gl.vertexAttrib4f(3,1,1,1,1);if(!m.hasUv)gl.vertexAttrib2f(2,0,0);
  if(m.inst)gl.drawElementsInstanced(gl.TRIANGLES,m.count,m.type,0,m.instN);else gl.drawElements(gl.TRIANGLES,m.count,m.type,0);
}
const bgVao=gl.createVertexArray();
let last=performance.now(),T=0,autoQ=false;
function frame(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;T+=dt;frameN++;
  fpsS=lerp(fpsS,1/Math.max(1e-3,(now-(frame.prev||now-16))/1000),0.05);frame.prev=now;
  {const tgt=params.night?22:14.5;params.timeOfDay+=(tgt-params.timeOfDay)*Math.min(1,dt*1.1);}
  applyTime(params.timeOfDay);
  if(params.autoHumidity){const target=params.lid?0.78:0.22;params.humidity+=(target-params.humidity)*dt*0.035;}
  burst=Math.max(0,burst-dt*0.35);wipe=Math.max(0,wipe-dt*0.02);
  const hum=params.humidity,clear=1-params.clarity*0.85,cond=smooth(0.3,1,hum)*clear*(1-wipe);
  F.uCond=cond;dropMesh.instN=params.glass?Math.floor(dropMesh.total*Math.min(1,smooth(0.15,1,hum)*(clear*1.3+0.1)*(1-wipe))):0;
  F.uLampI+=((params.lamp?5:0)-F.uLampI)*Math.min(1,dt*6);
  F.uHazeCol=[0.8,0.85,0.83].map(c=>c*(0.12+0.7*dayV+F.uLampI*0.05));
  lidT+=((params.lid?0:1)-lidT)*Math.min(1,dt*2.2);
  lidItem.model=M.chain(M.T(lerp(0,3.15,lidT),lerp(4.2,0,lidT)+Math.sin(Math.PI*lidT)*1.4,lerp(0,1.35,lidT)),M.RZ(Math.sin(Math.PI*lidT)*0.5));
  const wind=params.breeze*(params.lid?0.35:1)*(1+burst*1.5);
  F.uTime=T;F.uWind=wind;F.uGrowth=params.growth;F.uExposure=params.exposure;F.uShadowOn=shadowsOn?1:0;
  if(params.creatures)stepCreatures(dt,T,params.activity);
  // glow lights
  const glow=night*params.glow,ff=params.fireflies?night:0;
  F.uPLPos.set(F.mushPos,0);F.uPLCol.set(F.uEmCol.map(c=>c*glow*0.9),0);
  flies.forEach((f,i)=>{const a=f.a+T*f.s,b=f.b+T*f.s*1.3;f.p.set(Math.cos(a)*f.r+Math.sin(b*0.7)*0.25,f.h+Math.sin(b)*0.35,Math.sin(a*1.1)*f.r*0.9);
    f.bl=Math.pow(Math.max(0,Math.sin(T*1.7+f.blink)),3);if(i<2){F.uPLPos.set(f.p.arr(),3+i*3);F.uPLCol.set([0.75*ff*f.bl*0.35,1*ff*f.bl*0.35,0.25*ff*f.bl*0.35],3+i*3);}});
  for(const m of mist){m.p.y+=m.v*dt*(1+burst*3);m.p.x+=Math.sin(T*0.3+m.v*99)*dt*0.04*(1+wind);m.p.z+=Math.cos(T*0.25+m.v*77)*dt*0.04*(1+wind);if(m.p.y>3.75){seedMist(m);m.p.y=SOIL_Y+0.15;}}

  // camera
  if(camMode==='orbit'){updateOrbit(dt);}else updateRig(dt);
  const inside=Math.hypot(camPos.x,camPos.z)<2.3&&camPos.y<4.7;const fovT=(camMode!=='orbit'&&inside)?(asp0()<1?64:52):38;camFov+=(fovT-camFov)*Math.min(1,dt*2);
  const W=cv.width,Hh=cv.height,asp=W/Hh;
  F.uProj=M.persp(camFov*Math.PI/180,asp,0.02,120);F.uView=M.lookAt(camPos,camLook,V3(0,1,0));F.uCamPos=camPos.arr();
  const lc=V3(0,1.5,0),le=lc.clone().as(sunDir,14);F.uLightVP=M.mul(M.ortho(-4.5,4.5,-4.5,4.5,1,32),M.lookAt(le,lc,Math.abs(sunDir.y)>0.99?V3(0,0,1):V3(0,1,0)));

  if(params.creatures)drawCreatures(T);else for(const k of['sph','cyl','hemi','wing','shell'])pools[k].instN=0;
  pools.shellItem.hidden=!params.creatures;

  curProg=null;
  gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.disable(gl.BLEND);
  // shadow pass
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,null);
  if(shadowsOn){gl.bindFramebuffer(gl.FRAMEBUFFER,shadow.fb);gl.viewport(0,0,shadow.size,shadow.size);gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(2,4);
    for(const it of opaque)if(it.cast&&!it.hidden)drawItem(it,true);
    gl.disable(gl.POLYGON_OFFSET_FILL);gl.bindFramebuffer(gl.FRAMEBUFFER,null);}
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,shadow.tex);
  // main pass
  gl.viewport(0,0,W,Hh);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);useP(prog('bg',[]));gl.bindVertexArray(bgVao);gl.drawArrays(gl.TRIANGLES,0,3);gl.enable(gl.DEPTH_TEST);
  for(const it of opaque)if(!it.hidden)drawItem(it,false);
  // transparent: glass back, droplets, mist, fireflies, glass front
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);gl.enable(gl.CULL_FACE);
  const gp=prog('glass',[]);
  if(params.glass){useP(gp);gl.bindVertexArray(jarMesh.vao);gl.cullFace(gl.FRONT);gl.drawElements(gl.TRIANGLES,jarMesh.count,jarMesh.type,0);gl.cullFace(gl.BACK);}
  if(dropMesh.instN){useP(prog('glass',['DROP','INST']));gl.bindVertexArray(dropMesh.vao);gl.drawElementsInstanced(gl.TRIANGLES,dropMesh.count,dropMesh.type,0,dropMesh.instN);}
  {let o=0;const mistA=(hum*0.05*clear+burst*0.2)*(params.lid?1:0.6),ml=0.3+0.7*dayV;
    for(const m of mist){ptsData.set([m.p.x,m.p.y,m.p.z,0.93*ml,0.96*ml,0.95*ml,mistA,0.95],o);o+=8;}
    for(const f of flies){ptsData.set([f.p.x,f.p.y,f.p.z,0.85,1,0.44,ff*f.bl,0.12+0.08*f.bl],o);o+=8;}
    gl.bindBuffer(gl.ARRAY_BUFFER,ptsBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,ptsData);
    const pp=prog('pts',[]);useP(pp);U(pp,'uScale',Hh/(2*Math.tan(camFov*Math.PI/360)));gl.bindVertexArray(ptsVao);
    if(mistA>0.002){U(pp,'uAlphaMode',1);gl.drawArrays(gl.POINTS,0,MIST);}
    if(ff>0.01){U(pp,'uAlphaMode',0);gl.drawArrays(gl.POINTS,MIST,FLIES);}}
  if(params.glass){useP(gp);gl.bindVertexArray(jarMesh.vao);gl.drawElements(gl.TRIANGLES,jarMesh.count,jarMesh.type,0);}
  gl.depthMask(true);gl.disable(gl.BLEND);

  if(frameN%15===0)statusEl.textContent=(params.night?'Night':'Day')+(params.lamp?' · Lamp on':'');
  if(!autoQ&&T>4){autoQ=true;if(fpsS<30)applyQuality('Fast');}
  requestAnimationFrame(frame);
}

/* =========================================================
   Boot
   ========================================================= */
requestAnimationFrame(()=>requestAnimationFrame(()=>{
  try{build();}catch(err){loadingEl.textContent='Could not start: '+err.message;console.error(err);return;}
  applyQuality('Balanced');applyTime(params.timeOfDay);
  loadingEl.classList.add('hide');last=performance.now();requestAnimationFrame(frame);
}));
})();
</script>
